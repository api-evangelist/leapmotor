aid: leapmotor
name: Leapmotor
description: 'Leapmotor (Zhejiang Leapmotor Technology Co., Ltd., HKEX: 9863) is a Chinese intelligent
  electric vehicle manufacturer founded in 2015 and headquartered in Hangzhou, China, which sold its first
  vehicles in 2019. Leapmotor designs and builds battery-electric and range-extended (REEV) passenger
  vehicles — including the T03 city car and the B03X, B05, B10 and C10 SUVs — on its own vertically
  integrated LEAP platform, developing its electric drive, battery, and intelligent cockpit and driving
  systems in house. Stellantis took a stake in the company in 2023 and, through the Leapmotor
  International joint venture, distributes Leapmotor vehicles across Europe and other export markets via
  leapmotor.net. Leapmotor operates connected-vehicle services — the Leapmotor mobile app, OTA software
  updates, and the Leapmotor Connected Experience — but publishes no public developer API program,
  developer portal, or API documentation; the vehicle cloud interfaces used by its mobile app are private
  and only reached through unofficial, reverse-engineered community clients.'
